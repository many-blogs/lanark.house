name: Package posts

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "builders/**"
      - ".github/workflows/package-posts.yml"
  workflow_dispatch:

jobs:
  package:
    uses: many-blogs/.github/.github/workflows/package-jekyll-posts.yml@main
    with:
      site_id: lanark
    permissions:
      contents: write
